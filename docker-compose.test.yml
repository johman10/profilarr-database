version: '3.8'

services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr-test
    ports:
      - '6868:6868'
    environment:
      PUID: 505
      PGID: 20
      NODE_ENV: production
      LOG_LEVEL: debug
    volumes:
      - ./ops:/config/data/databases/851e47e6-a160-4bdc-a214-9f4a0baa0609/ops
      - ./deps:/config/data/databases/851e47e6-a160-4bdc-a214-9f4a0baa0609/deps
      - ./pcd.json:/config/data/databases/851e47e6-a160-4bdc-a214-9f4a0baa0609/pcd.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
